name: Deploy Site

# 官网自动部署：apps/site/ 或根 workspace 配置有改动推上 master 时
# 自动发布到 GitHub Pages（也可在 Actions → Deploy Site 手动触发）
on:
  push:
    branches: [master]
    paths:
      - "apps/site/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

# 同一时刻只跑一个部署，新的推送顶替排队中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/site lint

      - name: Build
        run: pnpm --dir apps/site build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
