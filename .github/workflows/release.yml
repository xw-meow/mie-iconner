name: Release

# 手动触发：Actions → Release → Run workflow
# macOS runner 消耗额度较大，发版时手动点。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        working-directory: app/src-tauri
        run: cargo test

      - name: Run frontend tests
        working-directory: app
        run: pnpm test

      - name: Build universal DMG
        run: app/scripts/package.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          DMG=$(ls app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          gh release create "$TAG" "$DMG" \
            --title "小羊贴纸铺 v${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes
