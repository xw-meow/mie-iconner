name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        run: swift test

      - name: Package .app
        run: scripts/package-app.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Sources/mie-iconner/Info.plist)
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          # --generate-notes 自动以上一个 tag 为起点汇总提交记录
          gh release create "$TAG" "dist/小羊贴纸铺-macOS.zip" \
            --title "小羊贴纸铺 v${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes
