name: Release

# 手动触发：Actions → Release → Run workflow
# macOS runner 消耗额度较大，发版时手动点。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build universal DMG
        run: bash scripts/package-desktop.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          DMG=$(ls apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          gh release create "$TAG" "$DMG" \
            --title "小羊贴纸铺 v${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes
